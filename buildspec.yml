
version: 0.2

env:
  parameter-store:
    LOGIN: LOGIN
    HOST: HOST
    Organization: Organization
    Project: Project

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Setting up Maven settings"
      - mkdir -p /root/.m2
      - cp ./settings.xml /root/.m2/settings.xml

      - echo "Getting CodeArtifact token"
      - export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain rexy --domain-owner 326306381458 --region ap-south-1 --query authorizationToken --output text)

      - echo "Installing Maven"
      - wget https://archive.apache.org/dist/maven/maven-3/3.9.4/binaries/apache-maven-3.9.4-bin.tar.gz
      - tar -xzf apache-maven-3.9.4-bin.tar.gz
      - mv apache-maven-3.9.4 /opt/maven
      - ln -sf /opt/maven/bin/mvn /usr/local/bin/mvn
      - mvn -v

  pre_build:
    commands:
      - echo "Installing dependencies"
      - apt-get update
      - apt-get install -y jq checkstyle curl

      - echo "Extracting branch name"
      - 'echo "CODEBUILD_SOURCE_VERSION=$CODEBUILD_SOURCE_VERSION"'
      - 'echo "CODEBUILD_WEBHOOK_HEAD_REF=$CODEBUILD_WEBHOOK_HEAD_REF"'
      - export BRANCH_NAME=$(echo "$CODEBUILD_WEBHOOK_HEAD_REF" | sed 's|refs/heads/||')
      - |
        if [ -z "$BRANCH_NAME" ]; then
          BRANCH_NAME=$(echo "$CODEBUILD_SOURCE_VERSION" | sed 's|refs/heads/||')
        fi
      - 'echo "Resolved branch name: $BRANCH_NAME"'

  build:
    commands:
      - echo "Running tests"
      - mvn clean test

      - echo "Running checkstyle"
      - mvn checkstyle:checkstyle

      - echo "Running SonarCloud analysis"
      - |
        if [ -n "$BRANCH_NAME" ]; then
          mvn sonar:sonar \
            -Dsonar.login="$LOGIN" \
            -Dsonar.host.url="$HOST" \
            -Dsonar.projectKey="$Project" \
            -Dsonar.organization="$Organization" \
            -Dsonar.branch.name="$BRANCH_NAME" \
            -Dsonar.java.binaries="target/classes" \
            -Dsonar.junit.reportsPath="target/surefire-reports" \
            -Dsonar.coverage.jacoco.xmlReportPaths="target/site/jacoco/jacoco.xml" \
            -Dsonar.java.checkstyle.reportPaths="target/checkstyle-result.xml"
        else
          mvn sonar:sonar \
            -Dsonar.login="$LOGIN" \
            -Dsonar.host.url="$HOST" \
            -Dsonar.projectKey="$Project" \
            -Dsonar.organization="$Organization" \
            -Dsonar.java.binaries="target/classes" \
            -Dsonar.junit.reportsPath="target/surefire-reports" \
            -Dsonar.coverage.jacoco.xmlReportPaths="target/site/jacoco/jacoco.xml" \
            -Dsonar.java.checkstyle.reportPaths="target/checkstyle-result.xml"
        fi

      - |
          echo "Waiting for SonarCloud Quality Gate"
          sleep 15

          echo "Checking Quality Gate status"
          curl -u "$LOGIN:" -s "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$Project" > result.json

          cat result.json

          STATUS=$(jq -r '.projectStatus.status' result.json)

          if [ "$STATUS" = "ERROR" ]; then
            echo "Quality Gate Failed"
            exit 1
          elif [ "$STATUS" = "OK" ]; then
            echo "Quality Gate Passed"
          else
            echo "Quality Gate status unknown: $STATUS"
          fi
        
artifacts:
  files:
    - '**/*'
